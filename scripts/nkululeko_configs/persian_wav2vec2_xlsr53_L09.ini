# Used with: python -m nkululeko.predict --type feats --model wav2vec2-large-xlsr-53 --config persian_wav2vec2_xlsr53_L09.ini ...
# Only FEATS.wav2vec2.layer needs to be set here; nkululeko.predict fills in
# EXP/DATA/MODEL defaults itself for --list mode (see predict.py _load_config).
[FEATS]
# facebook/wav2vec2-large-xlsr-53: 24 transformer layers, self-supervised only (no ASR fine-tuning), 1024-dim
# nkululeko counts wav2vec2.layer top-down: it truncates the model to
# (num_hidden_layers - wav2vec2.layer) layers and returns that truncated
# stack last layer output. To get bottom-up layer 9 of 24: wav2vec2.layer = 24 - 9 = 15.
wav2vec2.layer = 15
